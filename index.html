<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site-Specific Drawings Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function SiteDrawingsCalculator() {
            const [subtotal, setSubtotal] = useState('');
            const [state, setState] = useState('');
            const [zipCode, setZipCode] = useState('');
            const [calculatedPrice, setCalculatedPrice] = useState(null);

            const states = [
                'AL', 'AK', 'AZ', 'AR', 'CA', 'CO', 'CT', 'DE', 'FL', 'GA',
                'HI', 'ID', 'IL', 'IN', 'IA', 'KS', 'KY', 'LA', 'ME', 'MD',
                'MA', 'MI', 'MN', 'MS', 'MO', 'MT', 'NE', 'NV', 'NH', 'NJ',
                'NM', 'NY', 'NC', 'ND', 'OH', 'OK', 'OR', 'PA', 'RI', 'SC',
                'SD', 'TN', 'TX', 'UT', 'VT', 'VA', 'WA', 'WV', 'WI', 'WY'
            ];

            const handleZipCodeChange = (e) => {
                const value = e.target.value.replace(/\D/g, '');
                if (value.length <= 5) {
                    setZipCode(value);
                }
            };

            const handleCalculate = (e) => {
                e.preventDefault();

                if (!subtotal || !state || !zipCode) {
                    alert('Please fill in all fields');
                    return;
                }

                if (zipCode.length !== 5) {
                    alert('Zip code must be exactly 5 digits');
                    return;
                }

                const subtotalNum = parseFloat(subtotal);
                if (isNaN(subtotalNum) || subtotalNum <= 0) {
                    alert('Please enter a valid subtotal price');
                    return;
                }

                const drawingsPrice = subtotalNum * 0.10;
                setCalculatedPrice(drawingsPrice);
            };

            const handleReset = () => {
                setSubtotal('');
                setState('');
                setZipCode('');
                setCalculatedPrice(null);
            };

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(value);
            };

            return (
                <div style={{
                    backgroundColor: '#ffffff',
                    borderRadius: '12px',
                    boxShadow: '0 4px 6px rgba(0, 0, 0, 0.1)',
                    padding: '40px',
                    border: '1px solid #e0e0e0'
                }}>
                    <div style={{
                        marginBottom: '30px'
                    }}>
                        <svg
                            width="180"
                            height="40"
                            viewBox="0 0 360 40"
                            style={{ marginBottom: '20px' }}
                        >
                            <text
                                x="0"
                                y="32"
                                fontFamily="Arial, sans-serif"
                                fontSize="32"
                                fontWeight="900"
                                fill="#000000"
                            >
                                METAL
                            </text>
                            <text
                                x="118"
                                y="32"
                                fontFamily="Arial, sans-serif"
                                fontSize="32"
                                fontWeight="900"
                                fill="#ff2400"
                            >
                                AMERICA
                            </text>
                        </svg>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '12px'
                        }}>
                            <svg
                                width="32"
                                height="32"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#ff2400"
                                strokeWidth="2"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                            >
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="9" y1="15" x2="15" y2="15"></line>
                            </svg>
                            <h1 style={{
                                fontSize: '28px',
                                fontWeight: '600',
                                color: '#000000'
                            }}>
                                Site-Specific Drawings Calculator
                            </h1>
                        </div>
                    </div>

                    {!calculatedPrice ? (
                        <form onSubmit={handleCalculate}>
                            <div style={{ marginBottom: '24px' }}>
                                <label style={{
                                    display: 'block',
                                    marginBottom: '8px',
                                    fontSize: '14px',
                                    fontWeight: '500',
                                    color: '#000000'
                                }}>
                                    Building Subtotal (Pre-Tax) *
                                </label>
                                <div style={{ position: 'relative' }}>
                                    <span style={{
                                        position: 'absolute',
                                        left: '12px',
                                        top: '50%',
                                        transform: 'translateY(-50%)',
                                        color: '#666',
                                        fontSize: '16px'
                                    }}>$</span>
                                    <input
                                        type="number"
                                        step="0.01"
                                        min="0"
                                        value={subtotal}
                                        onChange={(e) => setSubtotal(e.target.value)}
                                        placeholder="0.00"
                                        style={{
                                            width: '100%',
                                            padding: '12px 12px 12px 28px',
                                            fontSize: '16px',
                                            border: '2px solid #e0e0e0',
                                            borderRadius: '8px',
                                            outline: 'none',
                                            transition: 'border-color 0.2s'
                                        }}
                                        onFocus={(e) => e.target.style.borderColor = '#ff2400'}
                                        onBlur={(e) => e.target.style.borderColor = '#e0e0e0'}
                                    />
                                </div>
                            </div>

                            <div style={{ marginBottom: '24px' }}>
                                <label style={{
                                    display: 'block',
                                    marginBottom: '8px',
                                    fontSize: '14px',
                                    fontWeight: '500',
                                    color: '#000000'
                                }}>
                                    State *
                                </label>
                                <select
                                    value={state}
                                    onChange={(e) => setState(e.target.value)}
                                    style={{
                                        width: '100%',
                                        padding: '12px',
                                        fontSize: '16px',
                                        border: '2px solid #e0e0e0',
                                        borderRadius: '8px',
                                        outline: 'none',
                                        transition: 'border-color 0.2s',
                                        backgroundColor: '#ffffff',
                                        cursor: 'pointer'
                                    }}
                                    onFocus={(e) => e.target.style.borderColor = '#ff2400'}
                                    onBlur={(e) => e.target.style.borderColor = '#e0e0e0'}
                                >
                                    <option value="">Select a state</option>
                                    {states.map(st => (
                                        <option key={st} value={st}>{st}</option>
                                    ))}
                                </select>
                            </div>

                            <div style={{ marginBottom: '32px' }}>
                                <label style={{
                                    display: 'block',
                                    marginBottom: '8px',
                                    fontSize: '14px',
                                    fontWeight: '500',
                                    color: '#000000'
                                }}>
                                    Zip Code (5 digits) *
                                </label>
                                <input
                                    type="text"
                                    inputMode="numeric"
                                    value={zipCode}
                                    onChange={handleZipCodeChange}
                                    placeholder="12345"
                                    maxLength="5"
                                    style={{
                                        width: '100%',
                                        padding: '12px',
                                        fontSize: '16px',
                                        border: '2px solid #e0e0e0',
                                        borderRadius: '8px',
                                        outline: 'none',
                                        transition: 'border-color 0.2s'
                                    }}
                                    onFocus={(e) => e.target.style.borderColor = '#ff2400'}
                                    onBlur={(e) => e.target.style.borderColor = '#e0e0e0'}
                                />
                            </div>

                            <button
                                type="submit"
                                style={{
                                    width: '100%',
                                    padding: '14px',
                                    fontSize: '16px',
                                    fontWeight: '600',
                                    color: '#ffffff',
                                    backgroundColor: '#ff2400',
                                    border: 'none',
                                    borderRadius: '8px',
                                    cursor: 'pointer',
                                    transition: 'background-color 0.2s'
                                }}
                                onMouseEnter={(e) => e.target.style.backgroundColor = '#cc1d00'}
                                onMouseLeave={(e) => e.target.style.backgroundColor = '#ff2400'}
                            >
                                Calculate Drawings Price
                            </button>
                        </form>
                    ) : (
                        <div>
                            <div style={{
                                backgroundColor: '#f5f5f5',
                                borderRadius: '8px',
                                padding: '24px',
                                marginBottom: '24px',
                                border: '2px solid #ff2400'
                            }}>
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '8px',
                                    marginBottom: '12px'
                                }}>
                                    <svg
                                        width="24"
                                        height="24"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="#ff2400"
                                        strokeWidth="2"
                                    >
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                    <h2 style={{
                                        fontSize: '18px',
                                        fontWeight: '600',
                                        color: '#000000'
                                    }}>
                                        Calculation Complete
                                    </h2>
                                </div>
                                <div style={{
                                    fontSize: '14px',
                                    color: '#666',
                                    marginBottom: '16px'
                                }}>
                                    Building Subtotal: {formatCurrency(parseFloat(subtotal))}
                                </div>
                                <div style={{
                                    fontSize: '32px',
                                    fontWeight: '700',
                                    color: '#ff2400',
                                    marginBottom: '8px'
                                }}>
                                    {formatCurrency(calculatedPrice)}
                                </div>
                                <div style={{
                                    fontSize: '14px',
                                    fontWeight: '500',
                                    color: '#000000'
                                }}>
                                    Site-Specific Engineered Drawings Price
                                </div>
                            </div>

                            <div style={{
                                backgroundColor: '#fffbea',
                                border: '1px solid #ff2400',
                                borderRadius: '8px',
                                padding: '20px',
                                marginBottom: '24px'
                            }}>
                                <div style={{
                                    display: 'flex',
                                    gap: '12px'
                                }}>
                                    <svg
                                        width="24"
                                        height="24"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="#ff2400"
                                        strokeWidth="2"
                                        style={{ flexShrink: 0, marginTop: '2px' }}
                                    >
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="16" x2="12" y2="12"></line>
                                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                                    </svg>
                                    <div>
                                        <h3 style={{
                                            fontSize: '16px',
                                            fontWeight: '600',
                                            color: '#000000',
                                            marginBottom: '8px'
                                        }}>
                                            Next Steps
                                        </h3>
                                        <p style={{
                                            fontSize: '14px',
                                            color: '#000000',
                                            lineHeight: '1.6'
                                        }}>
                                            Please add <strong>{formatCurrency(calculatedPrice)}</strong> as a custom expense
                                            on the contract in <strong>Idearoom</strong> or <strong>Sensei</strong>.
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <button
                                onClick={handleReset}
                                style={{
                                    width: '100%',
                                    padding: '14px',
                                    fontSize: '16px',
                                    fontWeight: '600',
                                    color: '#000000',
                                    backgroundColor: '#ffffff',
                                    border: '2px solid #000000',
                                    borderRadius: '8px',
                                    cursor: 'pointer',
                                    transition: 'all 0.2s'
                                }}
                                onMouseEnter={(e) => {
                                    e.target.style.backgroundColor = '#000000';
                                    e.target.style.color = '#ffffff';
                                }}
                                onMouseLeave={(e) => {
                                    e.target.style.backgroundColor = '#ffffff';
                                    e.target.style.color = '#000000';
                                }}
                            >
                                Calculate Another
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SiteDrawingsCalculator />);
    </script>
</body>
</html>
